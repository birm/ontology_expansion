<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross-Ontology Expansion</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='8' r='3' fill='%23570df8'/%3E%3Ccircle cx='12' cy='4' r='2.5' fill='%23570df8'/%3E%3Ccircle cx='12' cy='12' r='2.5' fill='%23570df8'/%3E%3C/svg%3E">
  <meta name="description" content="What typed OMOP + UMLS concept-set expansion adds, and why.">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="min-h-screen bg-base-200">
<div class="drawer lg:drawer-open">
  <input id="nav" type="checkbox" class="drawer-toggle">
  <div class="drawer-content flex flex-col min-w-0">
    <div class="navbar bg-base-100 border-b border-base-300 gap-2">
      <label for="nav" class="btn btn-ghost btn-sm lg:hidden">☰</label>
      <span class="flex-1 font-semibold truncate">Cross-ontology expansion</span>
      <select id="dataset" class="select select-bordered select-sm"></select>
      <input type="checkbox" value="dark" class="toggle toggle-sm theme-controller" aria-label="Dark mode">
      <button class="btn btn-ghost btn-sm btn-circle" onclick="info.showModal()" aria-label="Data sources">ⓘ</button>
    </div>

    <main class="p-4 space-y-4 max-w-6xl w-full">
      <div class="flex flex-wrap items-baseline gap-2">
        <h1 id="set-name" class="text-lg font-semibold break-all"></h1>
        <span id="set-meta" class="text-sm opacity-70"></span>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <span class="text-sm font-medium">Preset</span>
        <select id="preset" class="select select-bordered select-sm"></select>
      </div>
      <details id="edges" class="collapse collapse-arrow bg-base-100" open>
        <summary class="collapse-title text-sm font-medium min-h-0 py-3">Edge types</summary>
        <div class="collapse-content">
          <div id="toggles" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-3"></div>
        </div>
      </details>

      <div class="stats stats-vertical sm:stats-horizontal bg-base-100 w-full">
        <div class="stat"><div class="stat-title">OMOP baseline</div><div id="st-base" class="stat-value text-2xl"></div><div id="st-base-p" class="stat-desc"></div></div>
        <div class="stat"><div class="stat-title">Added concepts</div><div id="st-add" class="stat-value text-2xl"></div><div id="st-add-d" class="stat-desc"></div></div>
        <div class="stat"><div class="stat-title">New patients</div><div id="st-new" class="stat-value text-2xl"></div><div id="st-new-d" class="stat-desc"></div></div>
      </div>

      <div id="tabs" role="tablist" class="tabs tabs-boxed bg-base-100 flex flex-nowrap overflow-x-auto"></div>

      <div class="overflow-x-auto bg-base-100 rounded-box">
        <table class="table table-zebra table-sm">
          <thead><tr><th>Concept</th><th>Code</th><th>Via</th><th>OMOP</th><th class="text-right">Patients</th><th class="text-right">New</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <button id="more" class="btn btn-sm btn-block hidden">Show more</button>
    </main>
  </div>

  <div class="drawer-side z-20">
    <label for="nav" class="drawer-overlay"></label>
    <aside class="bg-base-100 w-72 min-h-full flex flex-col">
      <div class="p-3 border-b border-base-300">
        <input id="search" type="search" placeholder="Search sets" class="input input-bordered input-sm w-full">
      </div>
      <ul id="sets" class="menu menu-sm flex-nowrap overflow-y-auto"></ul>
    </aside>
  </div>
</div>

<dialog id="why" class="modal">
  <div class="modal-box max-w-2xl">
    <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
    <div id="why-body"></div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<dialog id="info" class="modal">
  <div class="modal-box">
    <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
    <h3 class="font-semibold mb-2">Data</h3>
    <ul id="info-body" class="text-sm space-y-2"></ul>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script src="app.js"></script>
</body>
</html>
